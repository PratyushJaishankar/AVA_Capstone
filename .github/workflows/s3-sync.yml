name: Sync S3 to Repo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # runs every hour

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync files from S3
        run: |
          mkdir -p synced
          aws s3 sync s3://github-aava-push-bucket ./synced

      - name: Commit changes
        run: |
          git config user.name "s3-sync-bot"
          git config user.email "bot@automation.local"

          git add .
          git diff --cached --quiet || git commit -m "Auto sync from S3"

      - name: Push changes
        run: git push
