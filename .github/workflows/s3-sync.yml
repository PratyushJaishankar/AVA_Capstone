name: Sync S3 to Repo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # runs every hour

jobs:
  sync:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required to push changes
    
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Fetch all history for proper sync

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: 'false'

      - name: Verify AWS credentials
        run: |
          echo "Verifying AWS credentials..."
          aws sts get-caller-identity
          echo "AWS credentials verified successfully"

      - name: Sync files from S3
        run: |
          echo "Starting S3 sync..."
          aws s3 sync s3://github-aava-push-bucket ./synced --delete
          echo "S3 sync completed"

      - name: Check for changes
        id: check_changes
        run: |
          git add synced
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected from S3"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected from S3"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "s3-sync-bot"
          git config user.email "bot@automation.local"
          
          git commit -m "Auto sync from S3 [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push

